<!doctype html>
<!-- Written by build.py from video.json: edit those, not this file. -->
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { {{VARS}} }
  * { box-sizing:border-box; margin:0 }
  html, body { background:var(--bg); width:1920px; height:1080px; overflow:hidden }
  #root { position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family:var(--body); color:var(--fg) }
  .clip { position:absolute; inset:0; overflow:hidden }
  .glow { position:absolute; border-radius:50%; filter:blur(150px); background:var(--acc); opacity:.2 }
  .grid { position:absolute; inset:0; background-image:radial-gradient(rgba(255,240,230,.07) 1.5px,transparent 1.5px); background-size:40px 40px }
  .k { font:700 24px var(--body); letter-spacing:.18em; text-transform:uppercase; color:var(--acc); display:flex; gap:14px; align-items:center }
  .k i { width:12px; height:12px; background:var(--acc); box-shadow:0 0 18px var(--acc) }
  .h { font:700 92px/1.02 var(--display); letter-spacing:-.035em }
  .h em { font-style:normal; color:var(--hi) }
  .p { font:500 32px/1.38 var(--body); color:var(--mut) }
  .p b { color:var(--fg) }
  .cap { position:absolute; display:flex; flex-direction:column; gap:22px; z-index:5 }
  .center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:24px }
  .cmd-row { display:flex; gap:26px; align-items:center; margin-top:14px }
  .cmd { font:700 40px var(--mono); color:var(--hi); background:color-mix(in srgb,var(--acc) 10%,transparent); border:2px solid color-mix(in srgb,var(--acc) 40%,transparent); border-radius:18px; padding:20px 34px }
  .cmd s { text-decoration:none; color:var(--mut) }
  .foot { font:700 28px var(--body); letter-spacing:.06em; color:var(--mut) }
  .big { font:700 300px/0.85 var(--display); letter-spacing:-.06em; color:var(--fg) }
  /* a <video> is letterboxed into its box: build.py always gives both sides, in the clip's aspect */
  video { position:absolute; display:block }
  .callout { position:absolute; z-index:10; padding:18px 26px; border-radius:18px; background:var(--acc); color:var(--ink); font:700 32px var(--body); box-shadow:0 30px 70px rgba(0,0,0,.5); white-space:nowrap }
  .callout.warn { background:var(--warn) }
  .callout.light { background:#efe4da }
  .lines path { opacity:0; fill:none; stroke:var(--hi); stroke-width:3; stroke-linecap:round; stroke-dasharray:2 10 }
  .lab { position:absolute; display:flex; flex-direction:column; gap:6px; text-align:center; align-items:center }
  .lab b { font:700 38px var(--display); letter-spacing:-.02em }
  .lab span { font:500 24px var(--body); color:var(--mut) }
  .slot { position:absolute }
  .big-lab { opacity:0 }
  .big-lab b { font-size:46px }
  .big-lab span { font-size:30px; color:var(--fg) }
  .cam { position:absolute; overflow:hidden; -webkit-mask-image:linear-gradient(180deg,transparent,#000 8%,#000 92%,transparent) }
  .cam video, .cam img { left:0; top:0 }
  .frame { position:absolute; border-radius:14px; overflow:hidden; box-shadow:0 24px 70px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08); transform-origin:50% 40% }
  .hl { position:absolute; border:4px solid var(--acc); border-radius:12px; box-shadow:0 0 0 9999px rgba(0,0,0,.35),0 0 32px color-mix(in srgb,var(--acc) 45%,transparent); opacity:0 }
  .caption { position:absolute; left:160px; right:160px; top:950px; display:flex; align-items:center; gap:22px; font:500 36px/1.25 var(--body) }
  .num { flex-shrink:0; display:grid; place-items:center; width:64px; height:64px; border-radius:50%; background:var(--acc); color:var(--ink); font-size:26px; font-weight:700 }
  .list { position:absolute; left:200px; right:200px; top:140px }
  .list ol { list-style:none; display:grid; gap:30px; margin-top:56px; padding:0 }
  .list li { display:grid; grid-template-columns:260px 1fr; align-items:baseline; gap:30px; font:500 40px/1.3 var(--body) }
  .list .ck { font:700 26px var(--body); letter-spacing:.12em; text-transform:uppercase; color:var(--acc) }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-duration="{{TOTAL}}">
  {{SOUND}}

{{SCENES}}

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true })
    const ease = 'power3.out'
    // a caption's lines come up one after another
    const enterCap = (id, at) => tl.fromTo(`${id} > *`, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease, stagger: 0.22 }, at)
    const pop = (id, at) => tl.fromTo(id, { scale: 0.6, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: 'back.out(1.7)' }, at)
    const rise = (ids, at, stagger = 0.3) => tl.fromTo(ids, { y: 80, opacity: 0, scale: 0.92 }, { y: 0, opacity: 1, scale: 1, duration: 0.8, ease: 'back.out(1.3)', stagger }, at)
    const labels = (ids, at) => tl.fromTo(ids, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease, stagger: 0.3 }, at)
    // a dotted line draws itself from the callout to what it points at
    const draw = (id, at) => {
      const len = document.querySelector(id).getTotalLength()
      tl.fromTo(id, { strokeDashoffset: len, opacity: 0 }, { strokeDashoffset: 0, opacity: 0.8, duration: 0.7, ease: 'power2.inOut' }, at)
    }
    // a number counts up to its value
    const count = (id, to, unit, at) => {
      const o = { v: 0 }
      tl.to(o, { v: to, duration: 1.6, ease: 'power2.in', onUpdate: () => { document.querySelector(id).textContent = Math.round(o.v) + unit } }, at)
    }
    // one tile at a time gets the light, holds it, then hands it on
    const spot = (id, at) => {
      tl.to(id, { scale: 1.07, filter: 'drop-shadow(0 0 28px rgba(217,119,87,.55))', duration: 0.4, ease }, at)
      tl.to(id, { scale: 1, filter: 'drop-shadow(0 0 0 rgba(217,119,87,0))', duration: 0.5, ease }, at + 1.1)
    }
    // each slot lands big in the middle while the rest blurs, says what it is, then glides into place
    const lineup = (sid, n, t0, each, zooms) => {
      const placed = [`#${sid}c`]
      for (let i = 0; i < n; i++) {
        const t = t0 + i * each
        const id = `#${sid}a${i}`
        const r = document.querySelector(id)
        const dx = 960 - (r.offsetLeft + r.offsetWidth / 2)
        const dy = 520 - (r.offsetTop + r.offsetHeight / 2)
        const rest = [...placed]
        tl.to(rest, { filter: 'blur(10px)', opacity: 0.3, duration: 0.5, ease: 'power2.out' }, t)
        tl.fromTo(id, { x: dx, y: dy, scale: zooms[i] * 0.6, opacity: 0 }, { scale: zooms[i], opacity: 1, duration: 0.7, ease: 'back.out(1.6)' }, t)
        tl.fromTo(`#${sid}b${i}`, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease }, t + 0.4)
        tl.to(`#${sid}b${i}`, { opacity: 0, duration: 0.3 }, t + each - 1.3)
        tl.to(id, { x: 0, y: 0, scale: 1, duration: 1.0, ease: 'power3.inOut' }, t + each - 1.2)
        tl.to(rest, { filter: 'blur(0px)', opacity: 1, duration: 0.6, ease: 'power2.out' }, t + each - 1.1)
        tl.fromTo(`#${sid}al${i}`, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease }, t + each - 0.5)
        placed.push(id, `#${sid}al${i}`)
      }
    }

    {{JS}}

    window.__timelines = window.__timelines || {}
    window.__timelines.root = tl
  </script>
</div>
</body>
</html>
